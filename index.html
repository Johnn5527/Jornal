<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trama Cultural — Jornal</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e9dfc9 radial-gradient(circle at 50% 30%,#f4ecda,#d8c9a8);font-family:Georgia,serif;color:#3b2a1a;display:flex;flex-direction:column;align-items:center}
header{text-align:center;padding:10px 8px 4px}h1{margin:0;font-size:clamp(1.2rem,4vw,2rem);letter-spacing:.05em}header p{margin:2px 0;font-size:.85rem;font-style:italic}
#wrap{width:min(96vw,1100px,calc((100vh - 160px)*1.414));flex:1;display:flex;align-items:center;justify-content:center;padding:6px}
#book{margin:0 auto}.page{background:#f3ead6;box-shadow:0 2px 12px rgba(0,0,0,.25)}.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
nav{display:flex;gap:12px;align-items:center;padding:10px 0 16px}button{font:inherit;background:#5a3d24;color:#f6eedd;border:0;border-radius:6px;padding:8px 16px;cursor:pointer}button:disabled{opacity:.4;cursor:default}#count{min-width:110px;text-align:center}
#fade{display:none;max-width:min(92vw,600px)}#fade img{width:100%;transition:opacity .3s}
@media (max-width:700px){#wrap{width:96vw}}@media (prefers-reduced-motion:reduce){#book{display:none}#fade{display:block}}
</style></head><body>
<header><h1>Trama Cultural — Jornal</h1><p>Arraste o canto, clique ou use as setas para virar a página</p></header>
<div id="wrap"><div id="book">
<div class="page" data-density="hard"><img src="pages/p1.jpg" alt="Página 1 — capa do jornal Trama Cultural"></div>
<div class="page"><img src="pages/p2.jpg" alt="Página 2 do jornal Trama Cultural" loading="lazy"></div>
<div class="page"><img src="pages/p3.jpg" alt="Página 3 do jornal Trama Cultural" loading="lazy"></div>
<div class="page"><img src="pages/p4.jpg" alt="Página 4 do jornal Trama Cultural" loading="lazy"></div>
<div class="page"><img src="pages/p5.jpg" alt="Página 5 do jornal Trama Cultural" loading="lazy"></div>
<div class="page"><img src="pages/p6.jpg" alt="Página 6 do jornal Trama Cultural" loading="lazy"></div>
<div class="page"><img src="pages/p7.jpg" alt="Página 7 do jornal Trama Cultural" loading="lazy"></div>
<div class="page" data-density="hard"><img src="pages/p8.jpg" alt="Página 8 — contracapa com QR code para a versão digital" loading="lazy"></div>
</div><div id="fade"><img id="fimg" src="pages/p1.jpg" alt="Página 1 — capa"></div></div>
<nav><button id="prev" aria-label="Página anterior">‹ Anterior</button><span id="count" aria-live="polite">Página 1 de 8</span><button id="next" aria-label="Próxima página">Próxima ›</button></nav>
<script src="js/page-flip.browser.js"></script>
<script>
const N=8,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,c=document.getElementById('count'),pv=document.getElementById('prev'),nx=document.getElementById('next');
function upd(i){c.textContent='Página '+(i+1)+' de '+N;pv.disabled=i<=0;nx.disabled=i>=N-1}
for(let i=1;i<=N;i++){const im=new Image();im.src='pages/p'+i+'.jpg'}
let go;
if(reduced){let i=0;const f=document.getElementById('fimg');go=d=>{i=Math.max(0,Math.min(N-1,i+d));f.style.opacity=0;setTimeout(()=>{f.src='pages/p'+(i+1)+'.jpg';f.alt='Página '+(i+1);f.style.opacity=1},150);upd(i)};upd(0)}
else{const pf=new St.PageFlip(document.getElementById('book'),{width:550,height:778,size:'stretch',minWidth:280,maxWidth:1000,minHeight:396,maxHeight:1414,showCover:true,usePortrait:true,mobileScrollSupport:false,maxShadowOpacity:.5,flippingTime:800});
pf.loadFromHTML(document.querySelectorAll('.page'));pf.on('flip',e=>upd(e.data));upd(0);go=d=>d>0?pf.flipNext():pf.flipPrev()}
pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
</script></body></html>
